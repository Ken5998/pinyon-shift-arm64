name: ARM64 sysroot

# Builds the ARM64 sysroot (scripts/build-sysroot.sh), publishes it as release
# sysroot-VERSION and pins it in sysroot.json, from where prepare-source.sh
# puts it in the launcher's toolchain list. Run it again only to refresh the
# sysroot; launcher releases keep using the one pinned.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the ARM64 sysroot
        run: scripts/build-sysroot.sh out/sysroot "$(date -u +%Y.%m.%d).$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-sysroot
          path: out/sysroot/
          retention-days: 3
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: arm64-sysroot
          path: out/sysroot
      - name: Publish and pin the sysroot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(ls out/sysroot/pinyon-arm64-sysroot-*.tar.xz)"
          name="$(basename "$archive" .tar.xz)"
          version="${name#pinyon-arm64-sysroot-}"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1 | tr a-f A-F)"
          cat > notes.md <<NOTES
          The ARM64 sysroot the Linux ARM64 launcher downloads to build Pinyon Shift on a handheld: Ubuntu 24.04 arm64 packages (glibc 2.39, GCC 14's libstdc++, X11, Wayland and audio development files, pkgconf and wayland-scanner). It holds no game files.

          The packages and versions inside are in $name.packages.txt, and each package's licence in usr/share/doc. Their sources are on https://launchpad.net/ubuntu.

          SHA-256: \`$sha256\`
          NOTES
          gh release create "sysroot-$version" "$archive" "out/sysroot/$name.packages.txt" \
            --title "ARM64 sysroot $version" --notes-file notes.md --latest=false
          jq -n --arg version "$version" --arg sha256 "$sha256" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/sysroot-$version/$name.tar.xz" \
            '{version: $version, url: $url, sha256: $sha256}' > sysroot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sysroot.json
          git commit -m "chore: pin the arm64 sysroot $version"
          git push
