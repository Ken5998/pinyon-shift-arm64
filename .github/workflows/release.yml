name: Launcher release

# Publishes the Linux ARM64 launcher for an upstream release as release
# vVERSION, the way upstream publishes its launchers: the launcher and the
# patched source, with the ARM64 sysroot pinned in sysroot.json. No game
# files: the launcher builds the game from the player's own disc on the
# device. Runs after the weekly check verifies a new upstream release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag (default the one in upstream.json)
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      overlay:
        description: Branch of this repository to release from (default the calling commit)
        type: string
        required: false

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.overlay }}
          fetch-depth: 0
      - name: Check that a sysroot is published
        run: |
          if [ ! -f sysroot.json ]; then
            echo "::error::No ARM64 sysroot is pinned yet; run the ARM64 sysroot workflow first."
            exit 1
          fi
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Check out upstream and apply the patches
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare-source.sh "$RUNNER_TEMP/pinyon-shift" ${REF:+"$REF"}
      - name: Package the launcher
        run: scripts/package-launcher.sh "$RUNNER_TEMP/pinyon-shift" out/launcher
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          src="$RUNNER_TEMP/pinyon-shift"
          archive=out/launcher/PinyonShift-Launcher-linux-arm64.tar.gz
          version="$(jq -r .version "$src/config/release.json")"
          upstream="${REF:-$(jq -r .tag upstream.json)}"
          sysroot="$(jq -r .version sysroot.json)"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Playing it on the handheld

          Pinyon Shift $version follows [upstream $upstream](https://github.com/arcanite24/pinyon-shift/releases/tag/$upstream). You bring an ISO of the USA retail disc (MS-2505); the launcher turns it into a native ARM64 build on the handheld itself.

          1. In Desktop Mode, extract PinyonShift-Launcher-linux-arm64.tar.gz in your home folder and open PinyonShift/PinyonShiftLauncher.
          2. Pick the ISO and press **Verify and build**. Plan 25 to 60 minutes on the charger and about 35 GB free; *Copying the game files* can sit at 0.0 GB for a few minutes before it moves.
          3. Press **Add to Steam** and start the game from Steam, so the handheld's controls reach it.

          Select + Start (or F6) opens the in-game settings; the README lists the ones that hold 60 fps with shadows on the Retroid Pocket 6. Already installed? The launcher offers this release by itself.

          Launcher SHA-256: \`$sha256\` (no game data in this release)
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Pinyon Shift $version for ARM64 Linux" \
              --notes-file notes.md
          fi
